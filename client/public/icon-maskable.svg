<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Team Hub">
  <title>Team Hub</title>
  <!-- Maskable variant: Android crops icons to whatever shape the launcher uses,
       so the mark is scaled into the safe zone (inner 80%) and the blue runs
       edge to edge. Using the plain icon here would clip the outer dots. -->
  <rect width="64" height="64" fill="#0d47a1"/>
  <g transform="translate(32 32) scale(0.72) translate(-32 -32)">
    <g stroke="#7ab8ff" stroke-width="6" stroke-linecap="round">
      <path d="M32 32 L32 12"/>
      <path d="M32 32 L49 42"/>
      <path d="M32 32 L15 42"/>
    </g>
    <circle cx="32" cy="32" r="9.5" fill="#fff"/>
    <circle cx="32" cy="12" r="5.5" fill="#fff"/>
    <circle cx="49" cy="42" r="5.5" fill="#fff"/>
    <circle cx="15" cy="42" r="5.5" fill="#fff"/>
  </g>
</svg>
